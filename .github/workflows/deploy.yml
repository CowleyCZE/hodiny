name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PA_HOST }}
          username: ${{ secrets.PA_USERNAME }}
          key: ${{ secrets.PA_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            mkdir -p /home/Cowley/hodiny/logs
            if [ ! -d /home/Cowley/hodiny/.git ]; then
              echo "Repo not found on server: /home/Cowley/hodiny"
              exit 1
            fi

            git -C /home/Cowley/hodiny fetch origin
            git -C /home/Cowley/hodiny checkout main
            git -C /home/Cowley/hodiny reset --hard origin/main

            touch /var/www/Cowley_pythonanywhere_com_wsgi.py
