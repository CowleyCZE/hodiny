{% extends "base.html" %}
{% block title %}Uživatelé - Hodiny{% endblock %}
{% block content %}<div class="animate-fadeIn"><div class="section-header"><h1 class="section-title">Uživatelé a role</h1></div><div class="glass-card mb-4"><form method="post" class="row g-2"><input type="hidden" name="action" value="create"><div class="col-md-3"><input class="form-control-modern" name="username" placeholder="Uživatelské jméno" required></div><div class="col-md-3"><input class="form-control-modern" name="password" type="password" placeholder="Heslo" required minlength="8"></div><div class="col-md-3"><select class="form-control-modern" name="role"><option value="viewer">Prohlížení</option><option value="manager">Manažer</option><option value="admin">Administrátor</option></select></div><div class="col-md-3"><button class="btn-modern btn-primary w-100">Přidat účet</button></div></form></div><div class="glass-card"><div class="card-table-wrapper"><table class="excel-table"><thead><tr><th>Uživatel</th><th>Role</th><th>Stav</th><th>Akce</th></tr></thead><tbody>{% for user in users %}<tr><td>{{ user.username }}</td><td>{{ user.role }}</td><td>{{ 'Aktivní' if user.active else 'Neaktivní' }}</td><td><form method="post"><input type="hidden" name="user_id" value="{{ user.id }}"><input type="hidden" name="action" value="{{ 'deactivate' if user.active else 'activate' }}"><button class="btn-modern btn-sm">{{ 'Deaktivovat' if user.active else 'Aktivovat' }}</button></form></td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
